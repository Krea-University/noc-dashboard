services:
  # 1. Database: MariaDB 11 Enterprise Engine
  db:
    image: mariadb:11
    container_name: krea-noc-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-noc_secure_pass}
      MYSQL_DATABASE: ${DB_NAME:-krea_noc}
      MYSQL_USER: ${DB_USER:-krea_noc}
      MYSQL_PASSWORD: ${DB_PASSWORD:-noc_secure_pass}
    volumes:
      - noc_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost", "-u", "${DB_USER:-krea_noc}", "-p${DB_PASSWORD:-noc_secure_pass}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - krea_noc_net

  # 2. Application: Compiled Go Modular Monolith Backend
  noc:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.backend
    container_name: krea-noc-app
    restart: always
    env_file:
      - .env
    environment:
      DB_DRIVER: mysql
      DB_HOST: db
      DB_PORT: 3306
    depends_on:
      db:
        condition: service_healthy
    networks:
      - krea_noc_net

  # 3. Static Server & Reverse Proxy: Nginx Alpine
  nginx:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.frontend
    container_name: krea-noc-nginx
    restart: always
    ports:
      - "80:80"
    depends_on:
      - noc
    networks:
      - krea_noc_net

networks:
  krea_noc_net:
    driver: bridge

volumes:
  noc_db_data:
    driver: local
